<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gallery | Family Orchards LLC</title>
  <meta
    name="description"
    content="Browse farm and product images from Family Orchards LLC."
  />
  <link rel="stylesheet" href="assets/css/banner.css" />
  <link rel="stylesheet" href="assets/css/site.css" />
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>

  <header>
    <div class="banner-wrapper" role="banner" aria-label="Family Orchards banner">
      <img class="site-banner" src="streetAIview.jpg" alt="Entrance gate and orchard at Family Orchards" />
      <p class="banner-title">Family Orchards, LLC</p>
    </div>

    <nav class="site-nav" aria-label="Primary">
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="gallery.html" aria-current="page">Gallery</a>
      <a href="index.html#production-plan">Production plan</a>
    </nav>
  </header>

  <main id="main-content">
    <section class="hero-panel" aria-labelledby="gallery-heading">
      <span class="eyebrow">Farm gallery</span>
      <h1 id="gallery-heading">Scenes from Family Orchards</h1>
      <p>
        A visual look at the property, farm planning, field work, and produce that support the Family Orchards story.
      </p>
    </section>

    <section class="section-panel" aria-labelledby="gallery-grid-heading">
      <h2 id="gallery-grid-heading">Photo gallery</h2>
      <div class="gallery-grid">
        <figure>
          <img src="streetAIview.jpg" alt="Entrance gate and orchard at Family Orchards" />
          <figcaption>Entrance and orchard view at Family Orchards.</figcaption>
        </figure>
        <figure>
          <img src="assets/gallery/satellite.jpg" alt="Satellite-style view of Family Orchards" />
          <figcaption>Property overview used for field planning and layout.</figcaption>
        </figure>
        <figure>
          <img src="assets/gallery/bcs.jpg" alt="Farm equipment and field work at Family Orchards" />
          <figcaption>Field work and equipment preparation on the farm.</figcaption>
        </figure>
        <figure>
          <img src="assets/gallery/dawan.jpg" alt="Daily farm activity at Family Orchards" />
          <figcaption>Another look at day-to-day activity around Family Orchards.</figcaption>
        </figure>
        <figure>
          <img src="assets/gallery/honeydew.jpg" alt="Produce grown at Family Orchards" />
          <figcaption>Produce and harvest potential as the farm expands its offerings.</figcaption>
        </figure>
        <figure>
          <img src="assets/plan/tilapia4.jpg" alt="Fish vendor holding tilapia at Portbell market" />
          <figcaption>Reference image for planned tilapia production. <a href="copyright.html#portbell-tilapia">Attribution</a>.</figcaption>
        </figure>
      </div>
    </section>

    <footer class="site-footer">
      <p><a href="products.html">Explore products and availability</a></p>
    </footer>
  </main>
</body>
</html>
